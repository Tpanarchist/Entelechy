[project]
name = "entelechy"
version = "0.0.1"
description = "Entelechy foundation kernel (experiment E000)"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.18"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]
